---
name: 🐛 Bug report
description: Report a reproducible StamCont bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve StamCont. Please include enough information to reproduce the problem without posting secrets, credentials, or sensitive logs.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched the [open StamCont issues](https://github.com/SaridakisStamatisChristos/StamCont/issues?q=is%3Aopen+is%3Aissue) for the same problem.
          required: true
        - label: I reviewed the relevant StamCont architecture/runtime documentation when this issue concerns agent execution, persistence, sandboxing, or resume behavior.
          required: false
  - type: textarea
    attributes:
      label: Environment
      description: Include only information relevant to the issue.
      value: |
        - OS:
        - StamCont commit/release:
        - Surface: CLI / VS Code / JetBrains / other
        - Node version:
        - Model/provider:
        - Legacy Continue-compatible package/extension version (if relevant):
    validations:
      required: true
  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction you can.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or diagnostics
      description: |
        Paste only the relevant, redacted output. Do not include API keys, credentials, private prompts, sensitive tool payloads, or opaque provider reasoning state.
      render: Shell
