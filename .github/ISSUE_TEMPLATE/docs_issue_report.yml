---
name: 📖 Documentation issue
description: Report missing, incorrect, or unclear StamCont documentation
labels: [area:docs]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve StamCont documentation.

        For StamCont-specific architecture, start with:
        - [Agent Runtime](https://github.com/SaridakisStamatisChristos/StamCont/blob/main/docs/STAMCONT_AGENT_RUNTIME.md)
        - [Agent Kernel](https://github.com/SaridakisStamatisChristos/StamCont/blob/main/docs/STAMCONT_AGENT_KERNEL.md)
        - [Contributing](https://github.com/SaridakisStamatisChristos/StamCont/blob/main/CONTRIBUTING.md)

        Some deeper documentation still describes inherited Continue-compatible interfaces. Please identify whether your report concerns current StamCont behavior or a legacy compatibility surface.

  - type: dropdown
    id: doc-issue-category
    attributes:
      label: Issue category
      options:
        - Missing StamCont documentation
        - Incorrect or outdated StamCont information
        - Legacy Continue wording / identity leak
        - Broken or dead link
        - Documentation organization
        - Suggested clarification
        - Other
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Affected file or page
      description: Provide a repository path or URL.
      placeholder: "docs/STAMCONT_AGENT_RUNTIME.md"
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Issue description
      description: Explain what is wrong, missing, misleading, or unclear.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Suggested correction
      description: Optional proposed wording or technical correction.
    validations:
      required: false
