name: StamCont Baseline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "stamcont/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stamcont-baseline-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  IGNORE_API_KEY_TESTS: "true"

jobs:
  core:
    name: Core / packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build local packages
        uses: ./.github/actions/setup-packages

      - name: Setup core
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Typecheck and lint core
        working-directory: core
        run: |
          npm run tsc:check
          npm run lint

      - name: Test core without external provider credentials
        working-directory: core
        run: |
          npm test -- --runInBand
          npm run vitest

  cli:
    name: CLI agent runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build local packages
        uses: ./.github/actions/setup-packages

      - name: Setup core
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Build core
        working-directory: core
        run: npm run build

      - name: Install CLI dependencies
        working-directory: extensions/cli
        run: npm ci --include=optional

      - name: Typecheck and lint CLI
        working-directory: extensions/cli
        run: npm run lint

      - name: Build CLI
        working-directory: extensions/cli
        run: npm run build

      - name: Run CLI unit and smoke tests
        working-directory: extensions/cli
        run: |
          npm test
          npm run test:smoke

  ide:
    name: GUI / VS Code
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Build local packages
        uses: ./.github/actions/setup-packages

      - name: Setup core
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Setup GUI
        uses: ./.github/actions/setup-component
        with:
          component: gui
          include-packages: false

      - name: Check GUI
        working-directory: gui
        run: |
          npm run tsc:check
          npm run lint
          npm test

      - name: Setup VS Code extension
        uses: ./.github/actions/setup-component
        with:
          component: vscode
          include-packages: false

      - name: Check VS Code extension
        working-directory: extensions/vscode
        run: |
          npm run write-build-timestamp
          npm run tsc:check
          npm run lint
          npm run vitest

  jetbrains:
    name: JetBrains
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-home-cache-cleanup: true

      - name: Test and package JetBrains plugin
        working-directory: extensions/intellij
        run: ./gradlew test buildPlugin --stacktrace --no-daemon

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Validate StamCont release ownership and quarantine
        run: node scripts/stamcont-release-policy.mjs

  native:
    name: Binary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Build local packages
        uses: ./.github/actions/setup-packages

      - name: Setup core
        uses: ./.github/actions/setup-component
        with:
          component: core
          include-root: true

      - name: Setup VS Code packaging dependencies
        uses: ./.github/actions/setup-component
        with:
          component: vscode
          include-packages: false

      - name: Setup binary
        uses: ./.github/actions/setup-component
        with:
          component: binary
          include-packages: false

      - name: Typecheck binary layer
        working-directory: binary
        run: npx tsc --noEmit

      - name: Verify committed Node 20 packager state
        working-directory: binary
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const rootPackage = require("./package.json");
          if (rootPackage.devDependencies?.["@yao-pkg/pkg"] !== "6.14.0") {
            throw new Error("@yao-pkg/pkg must be pinned to 6.14.0");
          }
          if (rootPackage.devDependencies?.pkg) {
            throw new Error("legacy pkg dependency must remain removed");
          }

          const root = path.join(process.cwd(), "pkgJson");
          for (const dir of fs.readdirSync(root)) {
            const packagePath = path.join(root, dir, "package.json");
            if (!fs.existsSync(packagePath)) continue;

            const pkg = JSON.parse(fs.readFileSync(packagePath, "utf8"));
            const targets = pkg.pkg?.targets ?? [];
            if (targets.length === 0 || targets.some((target) => !target.startsWith("node20-"))) {
              throw new Error(`${packagePath} must use only node20-* pkg targets`);
            }
          }
          NODE

      - name: Build native Linux x64 binary
        working-directory: binary
        run: node build.js --target linux-x64

      - name: Test packaged binary
        working-directory: binary
        run: npm test -- --runInBand

  baseline:
    name: Baseline gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - core
      - cli
      - ide
      - jetbrains
      - release-contract
      - native
    steps:
      - name: Require all baseline jobs
        shell: bash
        run: |
          test "${{ needs.core.result }}" = "success"
          test "${{ needs.cli.result }}" = "success"
          test "${{ needs.ide.result }}" = "success"
          test "${{ needs.jetbrains.result }}" = "success"
          test "${{ needs.release-contract.result }}" = "success"
          test "${{ needs.native.result }}" = "success"
